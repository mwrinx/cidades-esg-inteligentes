spring.application.name=cidades-esg-inteligentes
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cidades_esg}
spring.datasource.username=${DB_USER:esg}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS ${DB_SCHEMA:public}
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.environment=${APP_ENV:local}
app.version=${APP_VERSION:${RENDER_GIT_COMMIT:local}}
server.error.include-message=always
