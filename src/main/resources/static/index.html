<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cidades ESG Inteligentes</title>
<style>body{margin:0;background:#f2f6f4;color:#183b32;font:16px system-ui}main{max-width:1100px;margin:50px auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:38px;margin-bottom:8px}small{color:#58756b}#ambiente{background:#d5eee2;padding:10px 18px;border-radius:24px}section{background:white;border:1px solid #dbe6df;border-radius:18px;padding:26px;margin:24px 0}form{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:7px}input,select,textarea,button{font:inherit;padding:12px;border:1px solid #bdcec5;border-radius:8px}textarea{min-height:70px}.wide{grid-column:1/-1}button{background:#146447;color:white;cursor:pointer}button.secondary{background:white;color:#146447}article{border-top:1px solid #dbe6df;padding:18px 0;display:flex;justify-content:space-between;gap:18px}article p{white-space:pre-wrap;color:#58756b}#mensagem{min-height:24px;color:#9b342c}.actions{display:flex;gap:8px;align-items:center}@media(max-width:650px){form{grid-template-columns:1fr}header,article{display:block}h1{font-size:28px}}</style>
<main><header><div><small>GESTÃO MUNICIPAL • SUSTENTABILIDADE</small><h1>Cidades ESG Inteligentes</h1><p>Acompanhe iniciativas que transformam sua cidade.</p></div><span id="ambiente">Carregando…</span></header>
<section><h2 id="titulo">Nova iniciativa</h2><form id="form"><label>Nome<input name="nome" required maxlength="120"></label><label>Cidade<input name="cidade" required maxlength="120"></label><label>Categoria<select name="categoria"><option value="AMBIENTAL">Ambiental</option><option value="SOCIAL">Social</option><option value="GOVERNANCA">Governança</option></select></label><label>Status<select name="status"><option value="PLANEJADA">Planejada</option><option value="EM_ANDAMENTO">Em andamento</option><option value="CONCLUIDA">Concluída</option></select></label><label class="wide">Descrição<textarea name="descricao" required maxlength="2000"></textarea></label><button>Salvar iniciativa</button><button type="button" class="secondary" id="cancelar">Limpar / cancelar</button></form><p id="mensagem" role="status"></p></section><section><h2>Iniciativas cadastradas <small id="total"></small></h2><div id="lista"></div></section></main>
<script>
const form=document.querySelector('#form'),msg=document.querySelector('#mensagem');let editId=null;
const labels={AMBIENTAL:'Ambiental',SOCIAL:'Social',GOVERNANCA:'Governança',PLANEJADA:'Planejada',EM_ANDAMENTO:'Em andamento',CONCLUIDA:'Concluída'};
async function api(url,options){const r=await fetch('/api/'+url,options);if(!r.ok)throw Error('Não foi possível concluir a operação (HTTP '+r.status+'). Verifique os campos e tente novamente.');return r.status===204?null:r.json()}
function reset(){form.reset();editId=null;document.querySelector('#titulo').textContent='Nova iniciativa'}
async function listar(){const rows=await api('iniciativas'),list=document.querySelector('#lista');list.replaceChildren();document.querySelector('#total').textContent='('+rows.length+')';if(!rows.length)list.textContent='Nenhuma iniciativa cadastrada. Comece pelo formulário acima.';rows.forEach(i=>{const a=document.createElement('article'),d=document.createElement('div'),h=document.createElement('strong'),p=document.createElement('p'),meta=document.createElement('small'),actions=document.createElement('div');h.textContent=i.nome;meta.textContent=i.cidade+' • '+labels[i.categoria]+' • '+labels[i.status];p.textContent=i.descricao;d.append(h,document.createElement('br'),meta,p);actions.className='actions';const e=document.createElement('button'),x=document.createElement('button');e.textContent='Editar';x.textContent='Excluir';x.className='secondary';e.onclick=()=>{editId=i.id;for(const k of ['nome','cidade','descricao','categoria','status'])form.elements[k].value=i[k];document.querySelector('#titulo').textContent='Editar iniciativa';form.scrollIntoView({behavior:'smooth'})};x.onclick=async()=>{if(!confirm('Excluir esta iniciativa?'))return;try{await api('iniciativas/'+i.id,{method:'DELETE'});if(editId===i.id)reset();await listar();msg.textContent='Iniciativa excluída.'}catch(err){msg.textContent=err.message}};actions.append(e,x);a.append(d,actions);list.append(a)})}
form.onsubmit=async e=>{e.preventDefault();try{await api('iniciativas'+(editId?'/'+editId:''),{method:editId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});reset();await listar();msg.textContent='Iniciativa salva com sucesso.'}catch(err){msg.textContent=err.message}};
document.querySelector('#cancelar').onclick=reset;
Promise.all([api('ambiente').then(a=>{document.querySelector('#ambiente').textContent=a.ambiente.toUpperCase();document.querySelector('#ambiente').title='Versão: '+a.versao}),listar()]).catch(e=>msg.textContent=e.message);
</script></html>
